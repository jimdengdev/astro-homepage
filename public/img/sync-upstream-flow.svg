<svg viewBox="0 0 680 430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>拷贝仓库同步上游更新的流程与三种合并模式</title>
<desc>展示本地仓库通过 upstream remote 拉取上游代码，再按冲突类型选择合并模式的流程。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="30" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="500" fill="#1F1E1C">第一步：建立双 remote 模型</text>

<g>
  <rect x="40" y="46" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="160" y="66" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">你的仓库 origin</text>
  <text x="160" y="85" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">jimdengdev/astro-homepage</text>
</g>

<path d="M290 74 L390 74" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="64" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#6B6A66" text-anchor="middle">git fetch upstream</text>

<g>
  <rect x="400" y="46" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="520" y="66" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">上游仓库 upstream</text>
  <text x="520" y="85" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">cosZone/astro-koharu</text>
</g>

<path d="M340 110 L340 140" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="40" y="148" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="170" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">无共同祖先 → 必须加 --allow-unrelated-histories</text>
</g>

<path d="M340 192 L340 222" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="248" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="500" fill="#1F1E1C">第二步：按冲突程度选模式</text>

<g>
  <rect x="40" y="264" width="190" height="76" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="135" y="286" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">默认 merge</text>
  <text x="135" y="305" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">保留双方历史</text>
  <text x="135" y="323" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">首选，冲突少时用</text>
</g>

<g>
  <rect x="245" y="264" width="190" height="76" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="286" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">--rebase</text>
  <text x="340" y="305" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">提交变基到上游</text>
  <text x="340" y="323" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">历史线性，会改写</text>
</g>

<g>
  <rect x="450" y="264" width="190" height="76" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="545" y="286" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle" dominant-baseline="central">--clean</text>
  <text x="545" y="305" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">上游覆盖主题文件</text>
  <text x="545" y="323" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">冲突爆炸时的兜底</text>
</g>

<text x="40" y="368" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#6B6A66">用户内容（自动用 --ours 保留，不会丢）</text>

<g>
  <rect x="40" y="382" width="115" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="97" y="398" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">content/blog</text>
</g>
<g>
  <rect x="163" y="382" width="70" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="198" y="398" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">config</text>
</g>
<g>
  <rect x="241" y="382" width="128" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="305" y="398" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">public/img</text>
</g>
<g>
  <rect x="377" y="382" width="128" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="441" y="398" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">src/pages/*.md</text>
</g>
<g>
  <rect x="513" y="382" width="60" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="543" y="398" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">.env</text>
</g>
</svg>
